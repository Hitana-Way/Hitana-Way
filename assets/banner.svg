<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1035"/>
      <stop offset="0.45" stop-color="#4b2a7b"/>
      <stop offset="0.75" stop-color="#a45ca8"/>
      <stop offset="1" stop-color="#f3a6c8"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe3f1"/>
      <stop offset="0.5" stop-color="#ffb3d9"/>
      <stop offset="1" stop-color="#c77dff"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1550"/>
      <stop offset="1" stop-color="#120a24"/>
    </linearGradient>
    <clipPath id="sunClip">
      <rect x="0" y="0" width="1200" height="128"/>
      <rect x="0" y="136" width="1200" height="16"/>
      <rect x="0" y="160" width="1200" height="12"/>
      <rect x="0" y="180" width="1200" height="9"/>
      <rect x="0" y="197" width="1200" height="6"/>
      <rect x="0" y="211" width="1200" height="4"/>
    </clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.08"/>
    </pattern>
    <style>
      .tw{animation:tw 3s ease-in-out infinite}
      .tw2{animation:tw 4.5s ease-in-out infinite 1s}
      .tw3{animation:tw 2.2s ease-in-out infinite .5s}
      @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
      .float{animation:fl 6s ease-in-out infinite}
      @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      .cloud{animation:cl 40s linear infinite}
      .cloud2{animation:cl 60s linear infinite -20s}
      @keyframes cl{from{transform:translateX(-300px)}to{transform:translateX(1300px)}}
      .grid{animation:gr 2s linear infinite}
      @keyframes gr{from{transform:translateY(0)}to{transform:translateY(24px)}}
      .petal{animation:pt 9s linear infinite}
      .petal.b{animation-duration:12s;animation-delay:-4s}
      .petal.c{animation-duration:10s;animation-delay:-7s}
      .petal.d{animation-duration:14s;animation-delay:-2s}
      @keyframes pt{0%{transform:translate(0,-40px) rotate(0)}100%{transform:translate(-260px,480px) rotate(540deg)}}
      .blink{animation:bl 5s steps(1) infinite}
      @keyframes bl{0%,94%{opacity:1}95%,98%{opacity:0}}
      .title{font-family:'Trebuchet MS','Segoe UI',Verdana,sans-serif;font-weight:700}
      .jp{font-family:'Hiragino Maru Gothic Pro','Yu Gothic','Meiryo','Noto Sans JP',sans-serif}
      .win{animation:wl 4s ease-in-out infinite}
      @keyframes wl{0%,100%{opacity:.9}50%{opacity:.55}}
    </style>
  </defs>

  <rect width="1200" height="420" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#fff">
    <circle class="tw" cx="80" cy="40" r="1.6"/><circle class="tw2" cx="160" cy="90" r="1.2"/>
    <circle class="tw3" cx="260" cy="30" r="1.8"/><circle class="tw" cx="340" cy="110" r="1"/>
    <circle class="tw2" cx="430" cy="55" r="1.4"/><circle class="tw3" cx="520" cy="20" r="1.1"/>
    <circle class="tw" cx="700" cy="35" r="1.3"/><circle class="tw2" cx="780" cy="95" r="1.7"/>
    <circle class="tw3" cx="880" cy="50" r="1.2"/><circle class="tw" cx="960" cy="120" r="1"/>
    <circle class="tw2" cx="1040" cy="30" r="1.6"/><circle class="tw3" cx="1130" cy="80" r="1.3"/>
    <circle class="tw" cx="1170" cy="150" r="1"/><circle class="tw3" cx="40" cy="140" r="1.2"/>
  </g>
  <g fill="#ffe3f1" class="tw2">
    <path d="M220 150 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z"/>
    <path d="M1000 175 l2.5 7 7 2.5 -7 2.5 -2.5 7 -2.5 -7 -7 -2.5 7 -2.5z"/>
  </g>
  <g fill="#fff" class="tw3">
    <path d="M610 70 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z"/>
    <path d="M110 230 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z"/>
  </g>

  <!-- retro sun -->
  <circle cx="600" cy="240" r="150" fill="#ffb3d9" opacity=".35" filter="url(#soft)"/>
  <g transform="translate(0,90)">
    <circle cx="600" cy="150" r="120" fill="url(#sun)" clip-path="url(#sunClip)"/>
  </g>

  <!-- clouds -->
  <g class="cloud" fill="#ffd6ec" opacity=".55">
    <ellipse cx="0" cy="150" rx="70" ry="16"/><ellipse cx="35" cy="140" rx="40" ry="14"/>
  </g>
  <g class="cloud2" fill="#e0c3ff" opacity=".45">
    <ellipse cx="0" cy="205" rx="90" ry="14"/><ellipse cx="-30" cy="196" rx="45" ry="12"/>
  </g>

  <!-- mountains -->
  <path d="M0 300 L120 230 L210 280 L330 210 L440 300 Z" fill="#3a1d6b" opacity=".85"/>
  <path d="M760 300 L880 220 L980 270 L1080 200 L1200 260 L1200 300 Z" fill="#3a1d6b" opacity=".85"/>

  <!-- city silhouette -->
  <g fill="#24123f">
    <rect x="20" y="250" width="40" height="60"/><rect x="65" y="232" width="30" height="78"/>
    <rect x="100" y="262" width="45" height="48"/><rect x="150" y="240" width="25" height="70"/>
    <rect x="985" y="245" width="35" height="65"/><rect x="1025" y="225" width="28" height="85"/>
    <rect x="1058" y="258" width="50" height="52"/><rect x="1112" y="236" width="30" height="74"/>
    <rect x="1146" y="260" width="54" height="50"/>
  </g>
  <g fill="#ffcf7a" class="win">
    <rect x="72" y="245" width="5" height="5"/><rect x="82" y="262" width="5" height="5"/>
    <rect x="30" y="265" width="5" height="5"/><rect x="157" y="255" width="5" height="5"/>
    <rect x="1032" y="240" width="5" height="5"/><rect x="1040" y="270" width="5" height="5"/>
    <rect x="1120" y="250" width="5" height="5"/><rect x="1070" y="272" width="5" height="5"/>
  </g>
  <rect x="1036" y="205" width="3" height="20" fill="#24123f"/>
  <circle class="blink" cx="1037.5" cy="204" r="3" fill="#ff5fa2"/>

  <!-- ground + grid -->
  <rect x="0" y="300" width="1200" height="120" fill="url(#ground)"/>
  <rect x="0" y="299" width="1200" height="2" fill="#ff9ed2" opacity=".8" filter="url(#glow)"/>
  <svg x="0" y="300" width="1200" height="120" viewBox="0 0 1200 120" overflow="hidden">
    <g stroke="#c77dff" stroke-width="1.2" opacity=".55" fill="none">
      <g class="grid">
        <line x1="0" y1="-24" x2="1200" y2="-24"/><line x1="0" y1="0" x2="1200" y2="0"/>
        <line x1="0" y1="24" x2="1200" y2="24"/><line x1="0" y1="48" x2="1200" y2="48"/>
        <line x1="0" y1="72" x2="1200" y2="72"/><line x1="0" y1="96" x2="1200" y2="96"/>
        <line x1="0" y1="120" x2="1200" y2="120"/>
      </g>
      <line x1="600" y1="0" x2="600" y2="120"/>
      <line x1="560" y1="0" x2="440" y2="120"/><line x1="640" y1="0" x2="760" y2="120"/>
      <line x1="520" y1="0" x2="280" y2="120"/><line x1="680" y1="0" x2="920" y2="120"/>
      <line x1="480" y1="0" x2="120" y2="120"/><line x1="720" y1="0" x2="1080" y2="120"/>
      <line x1="440" y1="0" x2="-40" y2="120"/><line x1="760" y1="0" x2="1240" y2="120"/>
      <line x1="400" y1="0" x2="-200" y2="120"/><line x1="800" y1="0" x2="1400" y2="120"/>
    </g>
  </svg>

  <!-- sakura petals -->
  <g fill="#ffc1df">
    <ellipse class="petal" cx="900" cy="0" rx="5" ry="3"/>
    <ellipse class="petal b" cx="1100" cy="0" rx="4" ry="2.5"/>
    <ellipse class="petal c" cx="500" cy="0" rx="4.5" ry="2.8"/>
    <ellipse class="petal d" cx="750" cy="0" rx="3.5" ry="2.2"/>
    <ellipse class="petal b" cx="300" cy="0" rx="4" ry="2.5"/>
  </g>

  <!-- title -->
  <g class="float">
    <text x="600" y="120" text-anchor="middle" class="jp" font-size="22" fill="#ffe3f1" opacity=".85" letter-spacing="10">ヒタナ ✦ ようこそ</text>
    <text x="600" y="190" text-anchor="middle" class="title" font-size="76" fill="#3a1d6b" opacity=".5" transform="translate(4,4)">Hitana Way</text>
    <text x="600" y="190" text-anchor="middle" class="title" font-size="76" fill="#fff0fa" filter="url(#glow)">Hitana Way</text>
    <text x="600" y="228" text-anchor="middle" class="title" font-size="18" fill="none" stroke="#4b2a7b" stroke-width="5" stroke-linejoin="round" opacity=".8" letter-spacing="4">~ code · dreams · lofi vibes ~</text>
    <text x="600" y="228" text-anchor="middle" class="title" font-size="18" fill="#ffe3f1" letter-spacing="4">~ code · dreams · lofi vibes ~</text>
  </g>

  <rect width="1200" height="420" fill="url(#scan)"/>
</svg>
