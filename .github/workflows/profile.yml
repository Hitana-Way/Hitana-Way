name: profile (banner + contributions)

on:
  schedule:
    # 06h e 18h no horário de Brasília
    - cron: "2 9,21 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: build day or night images
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: |
          hour=$(TZ=America/Sao_Paulo date +%-H)
          if [ "$hour" -ge 6 ] && [ "$hour" -lt 18 ]; then mode=day; else mode=night; fi
          mkdir -p dist
          cp "assets/banner-$mode.svg" dist/banner.svg
          python3 scripts/contrib_sky.py "$mode" dist/contributions.svg

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
