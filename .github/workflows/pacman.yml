name: pacman contribution graph

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: recolor to purple
        run: |
          sed -i \
            -e 's/#161b22/#2a1550/Ig' -e 's/#0e4429/#4b2a7b/Ig' -e 's/#006d32/#7b2cbf/Ig' \
            -e 's/#26a641/#c77dff/Ig' -e 's/#39d353/#e0aaff/Ig' \
            dist/pacman-contribution-graph-dark.svg
          sed -i \
            -e 's/#ebedf0/#f3e8ff/Ig' -e 's/#9be9a8/#e0aaff/Ig' -e 's/#40c463/#c77dff/Ig' \
            -e 's/#30a14e/#9d4edd/Ig' -e 's/#216e39/#5a189a/Ig' \
            dist/pacman-contribution-graph.svg

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
